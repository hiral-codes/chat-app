scalar AWSDateTime

type User {
  userId: ID!
  displayName: String!
  avatarUrl: String
  onlineStatus: String!
  lastSeenAt: AWSDateTime
  lastHeartbeatAt: AWSDateTime
}

type Conversation {
  conversationId: ID!
  participants: [User!]!
  lastMessagePreview: String
  lastMessageAt: AWSDateTime
  receipts: [ConversationReceipt!]!
}

type Message {
  messageId: ID!
  conversationId: ID!
  senderId: ID!
  content: String!
  createdAt: AWSDateTime!
}

type ConversationReceipt {
  conversationId: ID!
  userId: ID!
  deliveredAt: AWSDateTime
  readAt: AWSDateTime
}

type UserPresence {
  userId: ID!
  onlineStatus: String!
  lastSeenAt: AWSDateTime
  lastHeartbeatAt: AWSDateTime
}

type TypingStatus {
  conversationId: ID!
  userId: ID!
  isTyping: Boolean!
  updatedAt: AWSDateTime!
}

type ConversationConnection {
  items: [Conversation!]!
  nextToken: String
}

type MessageConnection {
  items: [Message!]!
  nextToken: String
}

type ConversationThread {
  conversation: Conversation!
  messages: MessageConnection!
}

type Query {
  listConversations(limit: Int = 20, nextToken: String): ConversationConnection!
  getConversation(conversationId: ID!): Conversation!
  getConversationThread(conversationId: ID!, messagesLimit: Int = 30, messagesNextToken: String): ConversationThread!
  listMessages(conversationId: ID!, limit: Int = 30, nextToken: String): MessageConnection!
}

type Mutation {
  startConversation(otherUserId: ID!): Conversation!
  sendMessage(conversationId: ID!, content: String!): Message!
  markConversationDelivered(conversationId: ID!): ConversationReceipt!
  markConversationRead(conversationId: ID!): ConversationReceipt!
  updatePresence(online: Boolean!): UserPresence!
  updateTyping(conversationId: ID!, isTyping: Boolean!): TypingStatus!
}

type Subscription {
  onMessageSent(conversationId: ID!): Message
    @aws_subscribe(mutations: ["sendMessage"])
  onConversationReceiptUpdated(conversationId: ID!): ConversationReceipt
    @aws_subscribe(mutations: ["markConversationDelivered", "markConversationRead"])
  onPresenceChanged(userId: ID!): UserPresence
    @aws_subscribe(mutations: ["updatePresence"])
  onTypingChanged(conversationId: ID!): TypingStatus
    @aws_subscribe(mutations: ["updateTyping"])
}
