name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      stage:
        description: Backend environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  ci:
    name: Validate app
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AWS_REGION: ap-south-1
      NEXT_PUBLIC_APPSYNC_ENDPOINT: https://example.appsync-api.ap-south-1.amazonaws.com/graphql
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-south-1_example
      NEXT_PUBLIC_COGNITO_CLIENT_ID: example-client-id
      NEXT_PUBLIC_COGNITO_DOMAIN: example.auth.ap-south-1.amazoncognito.com
      NEXT_PUBLIC_COGNITO_REDIRECT_URI: http://localhost:3000/api/auth/callback
      NEXT_PUBLIC_COGNITO_LOGOUT_URI: http://localhost:3000/login
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Synth local backend
        run: npm run cdk:synth:local

  deploy-backend:
    name: Deploy backend
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: ci
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      COGNITO_CALLBACK_URLS: ${{ vars.COGNITO_CALLBACK_URLS }}
      COGNITO_LOGOUT_URLS: ${{ vars.COGNITO_LOGOUT_URLS }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deploy configuration
        run: |
          test -n "$COGNITO_CALLBACK_URLS"
          test -n "$COGNITO_LOGOUT_URLS"

      - name: Deploy CDK stack
        run: npx cdk deploy -a "tsx infra/bin/chat-app.ts" -c stage=${{ inputs.stage }} --require-approval never
